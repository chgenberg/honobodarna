name: Hämta BookVisit ankomstlista

# Hämtas av Railway-servern via workflow_dispatch (punktlig). Ingen GitHub-
# schedule: publika repo stänger av schemalagda workflows efter 60 dagar
# utan commits, och det blockerar även server-triggern.
# Manuell körning: Actions → "Hämta BookVisit ankomstlista" → Run workflow.
on:
  workflow_dispatch:
    inputs:
      arrival_date:
        description: "Ankomstdatum YYYY-MM-DD (tomt = idag i Stockholm)"
        required: false
        type: string

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Hämta & ladda upp ankomstlistan
        run: npx tsx scripts/fetch-arrival-list.ts
        env:
          BOOKVISIT_USER: ${{ secrets.BOOKVISIT_USER }}
          BOOKVISIT_PASS: ${{ secrets.BOOKVISIT_PASS }}
          BOOKVISIT_TOTP_SECRET: ${{ secrets.BOOKVISIT_TOTP_SECRET }}
          APP_UPLOAD_URL: ${{ secrets.APP_UPLOAD_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ARRIVAL_DATE: ${{ inputs.arrival_date }}
      - name: Spara felskärmdumpar (vid fel)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: debug-*.png
          if-no-files-found: ignore
